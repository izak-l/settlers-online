# The server stack on the VM: Postgres, the game server, and Caddy for HTTPS.
# Use it either from a clone of the repo on the VM (deploy/, next to deploy/.env) or from
# ~/settlers with an image shipped by scripts/deploy-server.sh. See docs/DEPLOY.md.
name: settlers

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: settlers
      POSTGRES_USER: settlers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlers -d settlers"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  server:
    image: settlers-server:${SERVER_TAG:-latest}
    # Build from the repo when this file is used from a checkout (deploy/ inside the repo):
    # `docker compose up -d --build`. A copy in ~/settlers with a shipped image never builds.
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # The database next door; overrides any DATABASE_URL in .env.
      DATABASE_URL: postgresql://settlers:${POSTGRES_PASSWORD}@db:5432/settlers
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
